<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon-logo-roxo.svg" type="image/svg+xml">
    <!-- usar a tag "type = image/svg+xml" serve para especificar o tipo de arquivo do ícone e o xml é para idicar qie que o SVG édesse tipo-->
    <!-- CSS - Cascade style sheet -->
    <!--
         - In line: É possível definir o CSS dentro do próprio HTML, mas não é recomendado, pois dificulta a manutenção do código e a reutilização do CSS em outras páginas.

         - Interno: É possível definir o CSS separado dentro do head e só chamar dentro do body. Para isso se utiliza a tag <style></style> dentro do head, mas não é recomendado, pois dificulta a manutenção do código e a reutilização do CSS em outras páginas.

         - Externo: É possível definir o CSS em um arquivo separado e só chamar dentro do head, é a melhor prática, pois facilita a manutenção do código e a reutilização do CSS em outras páginas. importa através de um link, como no exemplo abaixo. O arquivo CSS deve estar na mesma pasta do HTML ou em uma pasta separada, mas é necessário informar o caminho correto do arquivo CSS.
    -->
 <link rel="stylesheet" href="css/style.css">
    <!-- 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
-->


    <!-- Boa prática é o title ser a última coisa do head -->
    <title>TecBoard 3</title>
    

</head>

<body>
    <header>
        <!--<a href="index.html">-->
            <img src="img/Logo-branco.png" alt="Logo do site TecBoard">

            <a href="#">Testar versão demo</a>
            <img src="img/celulares-desktop.png" alt="Dois celulares sobrepostos com uma sombra roxa ao funo">
        </section>
    </main>
</body>
</html>
